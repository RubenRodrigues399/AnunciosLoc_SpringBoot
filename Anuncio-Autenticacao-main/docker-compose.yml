services:
  mysql:
    image: mysql
    ports:
      - "3307:3306"
    expose:
      - "3306"
    environment:
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=123
      - MYSQL_DATABASE=AuthAnunciosLocBD
      - MYSQL_ROOT_PASSWORD=123

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-auth
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - "8082:80"