services:
  mysql:
    image: mysql
    ports:
      - "3308:3306"
    expose:
      - "3306"
    environment:
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=123
      - MYSQL_DATABASE=bdinfra1
      - MYSQL_ROOT_PASSWORD=123

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-infra1
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - "8085:80"